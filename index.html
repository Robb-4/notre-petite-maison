<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notre Petite Maison</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
    { "imports": { "three": "./lib/three.module.js" } }
  </script>
</head>
<body>
  <div id="game-container">
    <canvas id="game"></canvas>
    <div id="tint"></div>

    <div id="hud">
      <div id="needs"></div>

      <div id="topright">
        <div id="clock">Jour 1 — 08:00</div>
        <div id="money" class="hidden">💶 50 €</div>
        <div id="quest">
          <div id="quest-title"></div>
          <div id="quest-step"></div>
        </div>
      </div>

      <div id="prompt" class="hidden"></div>
      <div id="bubble" class="hidden"></div>
      <div id="action-bar" class="hidden"><div id="action-fill"></div></div>

      <div id="dialogue" class="hidden">
        <div id="dlg-name"></div>
        <div id="dlg-text"></div>
        <div id="dlg-more">▼</div>
      </div>

      <div id="toast" class="hidden"></div>
    </div>

    <div id="sleep-fade"></div>

    <div id="gameover" class="hidden">
      <div id="go-card">
        <div id="go-skull">💀</div>
        <div id="go-text">Oups… morte de faim.</div>
        <div id="go-sub">(Même les Sims reviennent.)</div>
        <div id="go-hint">Appuie sur <span class="key">Entrée</span> — l'amour est plus fort que la mort ❤</div>
      </div>
    </div>

    <div id="cinematic" class="hidden">
      <div id="cine-card">
        <div id="cine-heart">❤</div>
        <div id="cine-text"></div>
        <div id="cine-hint"><span class="key">E</span> / clic pour continuer &nbsp;·&nbsp; <span class="key">Échap</span> pour passer</div>
      </div>
    </div>

    <div id="title-screen">
      <h1 id="title-name">Notre Petite Maison</h1>
      <p id="title-sub">Pour toi ❤</p>
      <p id="title-hint">Appuie sur <span class="key">Entrée</span> pour commencer</p>
      <p id="title-controls">ZQSD / flèches : se déplacer &nbsp;·&nbsp; E : interagir</p>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
